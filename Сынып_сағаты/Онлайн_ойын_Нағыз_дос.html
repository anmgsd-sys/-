<title>Нағыз дос</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen board game — warm dusk-plum ground, a golden plank-bridge rule under the header, one big question card at a time. Single deliberate dark look. */
:root {
  --asphalt: #2b1a2e;
  --asphalt-2: #3d2840;
  --lane: #f0b43c;
  --paper: #fff8ee;
  --ink: #2a1a10;
  --muted: #c7a9c4;
  --go: #22b55d;
  --stop: #e5483b;
  --wait: #f2c230;
  --sky: #1d8fa3;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--asphalt);
  background-image: radial-gradient(ellipse at 50% 120%, rgba(240,180,60,.18), transparent 55%);
  color: var(--paper);
  font-family: var(--body);
  font-size: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  padding-bottom: 14px;
  border-bottom: 10px solid transparent;
  border-image: repeating-linear-gradient(90deg, var(--lane) 0 34px, #b8822a 34px 37px) 10;
}
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(20px, 3.4vw, 32px); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--lane); }
.scores { display: flex; gap: 10px; flex-wrap: wrap; }
.chip {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px;
  background: var(--asphalt-2); border: 2px solid transparent; font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.chip b { font-family: var(--display); font-size: 22px; }
.chip.turn { border-color: var(--lane); box-shadow: 0 0 0 4px rgba(242,194,48,.18); }
.dot { width: 14px; height: 14px; border-radius: 50%; }
.progress { display: flex; gap: 6px; align-items: center; color: var(--muted); font-weight: 700; font-size: 15px; flex-wrap: wrap; }
.progress .seg { width: 22px; height: 8px; border-radius: 4px; background: var(--asphalt-2); }
.progress .seg.done { background: var(--go); }
.progress .seg.miss { background: var(--stop); }
.progress .seg.now { background: var(--lane); }

.card {
  background: var(--paper); color: var(--ink); border-radius: 22px; padding: clamp(18px, 3vw, 32px);
  display: flex; flex-direction: column; gap: 18px; min-width: 0;
}
.eyebrow { font-family: var(--display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #8a5a12; font-weight: 600; }
.q { font-size: clamp(22px, 3vw, 30px); font-weight: 800; margin: 0; text-wrap: balance; line-height: 1.25; }
.media { display: flex; justify-content: center; }
.media img { max-height: 240px; width: auto; max-width: 100%; }
.media img.map { max-height: 380px; border-radius: 14px; border: 3px solid #d6d2c4; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.opt {
  font: inherit; font-weight: 800; font-size: clamp(17px, 2.2vw, 21px); text-align: left;
  padding: 16px 18px; min-height: 68px; border-radius: 16px; cursor: pointer;
  background: #fff; color: var(--ink); border: 3px solid #d6d2c4;
  display: flex; align-items: center; gap: 12px; transition: transform .12s, border-color .12s;
}
.opt:hover:not(:disabled) { border-color: var(--sky); transform: translateY(-2px); }
.opt:focus-visible, .btn:focus-visible { outline: 4px solid var(--sky); outline-offset: 2px; }
.opt .k { font-family: var(--display); width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; background: #ece8dc; font-size: 16px; }
.opt.right { background: #dff5e7; border-color: var(--go); }
.opt.wrong { background: #fde3e0; border-color: var(--stop); }
.opt:disabled { cursor: default; }
.feedback { border-radius: 16px; padding: 14px 18px; font-weight: 700; font-size: 19px; line-height: 1.4; display: flex; gap: 12px; align-items: flex-start; }
.feedback.ok { background: #dff5e7; color: #0f5a2d; }
.feedback.bad { background: #fde3e0; color: #8a1d14; }
.feedback .lamp { width: 22px; height: 22px; border-radius: 50%; flex: none; margin-top: 3px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.btn {
  font: inherit; font-family: var(--display); font-weight: 600; font-size: 17px; cursor: pointer;
  padding: 14px 26px; border-radius: 999px; border: none; background: var(--ink); color: var(--paper);
}
.btn.go { background: var(--go); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid #c9c4b4; }
.order-slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.slot { min-height: 64px; border-radius: 14px; border: 3px dashed #c9c4b4; display: grid; place-items: center; font-family: var(--display); font-size: clamp(14px, 2vw, 18px); text-align: center; padding: 6px; }
.slot.filled { border-style: solid; color: #fff; }
.intro { text-align: center; align-items: center; padding-block: 40px; }
.intro .big { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6vw, 56px); line-height: 1.05; margin: 0; }
.intro p { max-width: 60ch; margin: 0; font-size: 20px; line-height: 1.5; }
.lights { display: flex; gap: 10px; justify-content: center; }
.lights i { width: 26px; height: 26px; border-radius: 50%; display: block; }
.mode { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.stars { font-size: 54px; letter-spacing: 6px; color: var(--wait); }
.stars .off { color: #d6d2c4; }
.cert { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
.cert img { width: 110px; height: 110px; }
footer { color: var(--muted); font-size: 14px; text-align: center; }
@media (max-width: 560px) { .order-slots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { .opt { transition: none; } }
</style>

  { r: 1, q: "Досыңмен ұрсысып қалдың. Татуласудың ең жақсы жолы:", o: ["Ол бірінші келгенше күтемін", "Бірінші болып сөйлесіп, сезімімді айтамын", "Басқа дос табамын"], a: 1, e: "Бірінші болып қол созу — әлсіздік емес, күштіліктің белгісі." },

  { r: 2, q: "«Жүз сомың болғанша, ...»", o: ["жүз досың болсын", "жүз қойың болсын", "жүз кітабың болсын"], a: 0, e: "«Жүз сомың болғанша, жүз досың болсын» — дос ақшадан қымбат." },
  { r: 2, q: "«Дос жылатып айтады, ...»", o: ["дұшпан күлдіріп айтады", "дұшпан үндемейді", "көрші тыңдайды"], a: 0, e: "Нағыз дос ащы болса да шындықты айтады, дұшпан жағымпазданады." },
  { r: 2, q: "«Досың мың болса да аз, ...»", o: ["дұшпаның біреу болса да көп", "туысың жүз болса да аз", "көршің бір болса да көп"], a: 0, e: "Достықты көбейтіп, жаулықтан аулақ болайық." },
  { r: 2, q: "«Досыңның кім екенін айт, ...»", o: ["сенің кім екеніңді айтайын", "үйінің қайда екенін айтайын", "оны да шақырайық"], a: 0, e: "Адамды досына қарап таниды." },
  { r: 2, type: "order", q: "«Достық көпірін» сал: достықтың қалай нығаятынын ретімен бас:", items: ["Танысу", "Тыңдау", "Сенім", "Бірге қиындықты жеңу"], colors: ["#1d8fa3", "#2f9e6f", "#d9a514", "#c0702a"], e: "Танысып, тыңдап, сенім артып, қиындықты бірге жеңгенде достық алтын көпірге айналады." }
];
let teams = [], turn = 0, idx = -1, answered = false, results = [], orderPicked = [];
let audio;
function beep(ok) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.connect(g); g.connect(audio.destination);
    o.frequency.value = ok ? 880 : 220; o.type = ok ? "sine" : "square";
    g.gain.setValueAtTime(.12, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + (ok ? .35 : .45));
    o.start(); o.stop(audio.currentTime + .5);
  } catch (e) {}
}
const $ = s => document.querySelector(s);
const card = $("#card");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderScores() {
  $("#scores").innerHTML = teams.map((t, i) =>
    `<div class="chip ${teams.length > 1 && i === turn && idx >= 0 && idx < Q.length ? "turn" : ""}"><span class="dot" style="background:${t.c}"></span>${esc(t.n)} <b>${t.s}</b></div>`).join("");
}
function renderProgress() {
  $("#progress").innerHTML = Q.length && idx >= 0 ? Q.map((_, i) =>
    `<span class="seg ${results[i] === true ? "done" : results[i] === false ? "miss" : i === idx ? "now" : ""}"></span>`).join("") + `<span>&nbsp;${Math.min(idx + 1, Q.length)} / ${Q.length}</span>` : "";
}

function start() {
  idx = -1; results = []; turn = 0;
  card.className = "card intro";
  card.innerHTML = `
    <img src="${IMG.cover}" alt="Алтын көпір үстіндегі достар" style="width:100%;max-width:560px;border-radius:16px">
    <p class="big">Достық — алтын көпір</p>
    <p>Үш раунд: достықтың қасиеттері, жағдаяттар және мақал-мәтелдер. Әр дұрыс жауапқа — 1 ұпай.</p>
    <div class="mode">
      <button class="btn go" id="m1">Бүкіл сынып болып ойнау</button>
      <button class="btn" id="m2">Екі команда болып ойнау</button>
    </div>`;
  teams = [{ n: "Сынып", s: 0, c: "var(--go)" }];
  renderScores(); renderProgress();
  $("#m1").onclick = () => { teams = [{ n: "Сынып", s: 0, c: "var(--go)" }]; next(); };
  $("#m2").onclick = () => { teams = [{ n: "Күн", s: 0, c: "var(--lane)" }, { n: "Ай", s: 0, c: "var(--sky)" }]; next(); };
}

function next() {
  idx++;
  if (idx >= Q.length) return finish();
  const q = Q[idx];
  if (idx === 0 || Q[idx - 1].r !== q.r) return roundIntro(q.r);
  ask();
}
function roundIntro(r) {
  card.className = "card intro";
  card.innerHTML = `<div class="eyebrow">${esc(ROUNDS[r].name.split(" · ")[0])}</div>
    <p class="big">${esc(ROUNDS[r].name.split(" · ")[1])}</p><p>${esc(ROUNDS[r].text)}</p>
    <button class="btn go" id="go">Бастау</button>`;
  renderScores(); renderProgress();
  $("#go").onclick = ask; $("#go").focus();
}
function ask() {
  answered = false; orderPicked = [];
  const q = Q[idx];
  card.className = "card";
  const who = teams.length > 1 ? ` · Кезек: ${esc(teams[turn].n)}` : "";
  let body = `<div class="eyebrow">${esc(ROUNDS[q.r].name)}${who}</div>`;
  if (q.img) body += `<div class="media"><img class="${q.map ? "map" : ""}" src="${IMG[q.img]}" alt=""></div>`;
  body += `<p class="q">${esc(q.q)}</p>`;
  if (q.type === "order") {
    body += `<div class="order-slots" id="slots">${q.items.map(() => `<div class="slot"></div>`).join("")}</div>
      <div class="opts" id="opts">${shuffle(q.items.map((t, i) => i)).map(i => `<button class="opt" data-i="${i}"><span class="k">?</span>${esc(q.items[i])}</button>`).join("")}</div>`;
  } else {
    body += `<div class="opts" id="opts">${q.o.map((t, i) => `<button class="opt" data-i="${i}"><span class="k">${"АБВ"[i]}</span>${esc(t)}</button>`).join("")}</div>`;
  }
  body += `<div id="fb"></div>`;
  card.innerHTML = body;
  renderScores(); renderProgress();
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => q.type === "order" ? pickOrder(b) : choose(+b.dataset.i));
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickOrder(btn) {
  if (answered) return;
  const q = Q[idx], i = +btn.dataset.i;
  const slot = $("#slots").children[orderPicked.length];
  if (i !== orderPicked.length) {
    btn.classList.add("wrong"); setTimeout(() => btn.classList.remove("wrong"), 450);
    if (!btn.dataset.missed) { btn.dataset.missed = 1; Q[idx].missed = true; }
    beep(false); return;
  }
  orderPicked.push(i); btn.disabled = true; btn.classList.add("right");
  slot.textContent = q.items[i]; slot.classList.add("filled"); slot.style.background = q.colors[i]; slot.style.borderColor = q.colors[i];
  if (orderPicked.length === q.items.length) settle(!q.missed);
}
function choose(i) {
  if (answered) return;
  const q = Q[idx];
  card.querySelectorAll(".opt").forEach((b, k) => { b.disabled = true; if (k === q.a) b.classList.add("right"); else if (k === i) b.classList.add("wrong"); });
  settle(i === q.a);
}
function settle(ok) {
  answered = true; results[idx] = ok; beep(ok);
  if (ok) teams[turn].s++;
  const q = Q[idx];
  $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "bad"}"><span class="lamp" style="background:${ok ? "var(--go)" : "var(--stop)"}"></span>
    <div>${ok ? "Дұрыс! " : "Қате. "}${esc(q.e)}</div></div>
    <div class="row" style="margin-top:14px"><button class="btn go" id="nx">${idx === Q.length - 1 ? "Нәтижені көру" : "Келесі сұрақ"}</button></div>`;
  if (teams.length > 1) turn = 1 - turn;
  renderScores(); renderProgress();
  $("#nx").onclick = next; $("#nx").focus();
}
function finish() {
  const total = results.filter(Boolean).length, pct = total / Q.length;
  const stars = pct >= .85 ? 3 : pct >= .6 ? 2 : 1;
  let who = "";
  if (teams.length > 1) {
    const [a, b] = teams;
    who = a.s === b.s ? "Тең ойын! Екі команда да жарайсыңдар!" : `Жеңімпаз — «${esc((a.s > b.s ? a : b).n)}» командасы!`;
  }
  card.className = "card intro";
  card.innerHTML = `<div class="stars">${"★".repeat(stars)}<span class="off">${"★".repeat(3 - stars)}</span></div>
    <p class="big">${Q.length} сұрақтың ${total}-іне дұрыс жауап!</p>
    ${who ? `<p><b>${who}</b></p>` : ""}
    <div class="cert"><img src="${IMG.web}" alt="" style="border-radius:50%;object-fit:cover"><p style="text-align:left;max-width:34ch">Жарайсыңдар! Сендер — <b>нағыз достарсыңдар</b>. Бір-біріңе әрдайым алтын көпір болыңдар!</p></div>
    <button class="btn" id="again">Қайта ойнау</button>`;
  Q.forEach(q => delete q.missed);
  renderScores(); renderProgress();
  $("#again").onclick = start;
}
start();
</script>
